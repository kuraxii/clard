# Clard GitHub Release 流水线：打 v* 标签（或手动触发）→ Fedora 容器内
# 走本地同款 packaging/build-rpm.sh → 产出 RPM + 二进制 tarball → 创建 GitHub Release。
#
# 触发方式：
#   git tag v0.1.0 && git push origin v0.1.0     # 自动构建并发布
#   Actions 页手动 Run workflow（需填 tag 名）
#
# 两 job 结构：build 在 Fedora 容器内构建（与本地环境一致，systemd-rpm-macros 宏齐全），
# 经 upload-artifact 传产物；release 在无容器的 runner 上传（容器内跑 node action 时
# docker exec 的工作目录与 shell 步骤路径是两套 bind mount，glob 会漏文件，故拆开）。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 tag 名（例如 v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build RPM + assets
    runs-on: ubuntu-latest
    container:
      # 与 packaging/clard.spec 依赖一致：systemd-rpm-macros 提供 %systemd_post 等宏
      image: fedora:latest
      options: --user root
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo git bash curl tar gzip \
            rpm-build systemd-rpm-macros \
            perl-core   # native-tls-vendored 源码编译 OpenSSL 需要 FindBin 等 perl 核心模块

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM (cargo build --release → 下载 mihomo → rpmbuild)
        run: |
          cd "$GITHUB_WORKSPACE"
          # 容器内 root 对 runner 挂载的仓库目录报 dubious ownership，git archive 前声明安全
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash packaging/build-rpm.sh

      - name: Stage release assets
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*= *"([^"]+)"/\1/')
          mkdir -p dist pkg
          # RPM
          cp ~/rpmbuild/RPMS/*/clard-*.rpm dist/
          # 二进制 tarball（非 RPM 发行版/免安装场景可用）
          cp target/release/clard target/release/clard-helper pkg/
          cp packaging/clard-helper.service README.md pkg/
          tar -czf "dist/clard-${VERSION}-x86_64-linux.tar.gz" \
            -C pkg clard clard-helper clard-helper.service README.md
          (cd dist && sha256sum clard-* > sha256sums.txt)
          echo "==> release assets:"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clard-dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: clard-dist
          path: clard-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            clard-dist/*.rpm
            clard-dist/*.tar.gz
            clard-dist/sha256sums.txt
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
