# Clard 构建流水线：CI 检查 + release 构建发布合并为一个 workflow。
#
# 触发与行为：
#   - push main / PR：只跑 check（clippy + test + --locked），失败即流水线失败；
#   - 打 v* 标签（或 Actions 手动 dispatch）：check 通过后 → Fedora 容器构建
#     RPM + 二进制 tarball → 发布 GitHub Release；check 失败则构建不启动。
#
# 拆分原因（保留自原 release.yml）：构建在容器内、发布在无容器 runner——
# 容器内跑 node action 时 docker exec 的工作目录与 shell 步骤路径是两套 bind mount，
# glob 会漏文件，故 build（容器）与 publish（runner）拆成两个 job。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 tag 名（例如 v0.3.2）'
        required: true

permissions:
  contents: write

jobs:
  check:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace --locked

  release-build:
    name: Build RPM + assets
    runs-on: ubuntu-latest
    needs: check
    # 仅 v* 标签或手动 dispatch 触发构建；check 失败则不会进入（ci 失败构建停止）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    container:
      # 与 packaging/clard.spec 依赖一致：systemd-rpm-macros 提供 %systemd_post 等宏。
      # 钉 fedora:39（EOL，dnf 源需切 archive；自带 rust 1.73 不满足 edition 2024 →
      # 用 rustup 装 1.95.0，对齐 rust-toolchain.toml / check job）。
      image: fedora:39
      options: --user root
    steps:
      - name: Fix EOL repos + install build dependencies
        run: |
          # Fedora 39 已 EOL：官方镜像仓库指向已下线的 mirrorlist，切到 archive 源
          sed -i 's/metalink=/#metalink=/g' /etc/yum.repos.d/*.repo
          sed -i 's|#baseurl=http://download.example/pub/fedora/linux|baseurl=https://dl.fedoraproject.org/pub/archive/fedora/linux|g' /etc/yum.repos.d/*.repo
          dnf install -y --setopt=install_weak_deps=False \
            git bash curl tar gzip \
            rpm-build systemd-rpm-macros \
            perl-core   # native-tls-vendored 源码编译 OpenSSL 需要 FindBin 等 perl 核心模块
          # rust 1.95.0（Fedora 39 自带 rust 1.73 < edition 2024 下限 1.85）
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM (cargo build --release → 下载 mihomo → rpmbuild)
        run: |
          cd "$GITHUB_WORKSPACE"
          # 容器内 root 对 runner 挂载的仓库目录报 dubious ownership，git archive 前声明安全
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash packaging/build-rpm.sh

      - name: Stage release assets
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*= *"([^"]+)"/\1/')
          mkdir -p dist pkg
          # RPM
          cp ~/rpmbuild/RPMS/*/clard-*.rpm dist/
          # 二进制 tarball（非 RPM 发行版/免安装场景可用）
          cp target/release/clard target/release/clard-helper pkg/
          cp packaging/clard-helper.service README.md pkg/
          tar -czf "dist/clard-${VERSION}-x86_64-linux.tar.gz" \
            -C pkg clard clard-helper clard-helper.service README.md
          (cd dist && sha256sum clard-* > sha256sums.txt)
          echo "==> release assets:"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clard-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release-build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: clard-dist
          path: clard-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            clard-dist/*.rpm
            clard-dist/*.tar.gz
            clard-dist/sha256sums.txt
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
