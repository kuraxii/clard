[package]
name = "clard_rs"
authors = []
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
abscissa_core = "0.9.0"
clap = "4"
serde = { version = "1", features = ["serde_derive"] }
serde_json = "1"
thiserror = "1"

# Async runtime + HTTP-over-(tcp|unix-socket)
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = "0.12.25"
colored = "3.0.0"
ratatui = "0.29.0"

[dev-dependencies]
abscissa_core = { version = "0.9.0", features = ["testing"] }
once_cell = "1.2"

