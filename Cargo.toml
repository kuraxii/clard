[package]
name = "clard_rs"
authors = []
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
abscissa_core = "0.9.0"
clap = "4"
serde = { version = "1", features = ["serde_derive"] }
serde_json = "1"
thiserror = "1"

tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread", "signal"] }
tokio-tungstenite = "0.28.0"
bytes = "1"
reqwest = {version = "0.12.25", features = ["json", "blocking"]}
colored = "3.0.0"
ratatui = "0.29.0"
futures-util = "0.3.31"
http = "1.4.0"
rand = "0.9.2"
base64 = "0.22.1"
dashmap = "6.1.0"
toml = "0.9.10"
shellexpand = "3.1.1"
tracing = "0.1.44"


[dev-dependencies]
abscissa_core = { version = "0.9.0", features = ["testing"] }
once_cell = "1.2"

