[workspace]
resolver = "2"
members = [
    "crates/clard-config",
    "crates/clard-core",
    "crates/clard-proto",
    "crates/clard-helper",
    "crates/clard-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[workspace.lints.clippy]
# 禁止隐式 panic：panic! / unwrap / expect / 索引与切片越界
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

# 共享依赖版本（crate 内用 `foo.workspace = true` 引用）
[workspace.dependencies]
serde = { version = "1", features = ["serde_derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "rt",
    "rt-multi-thread",
    "signal",
    "process",
] }
tokio-util = "0.7.18"
tokio-tungstenite = "0.28.0"
futures-util = "0.3.31"
tracing = "0.1.44"
http = "1.4.0"
reqwest = { version = "0.12.25", features = ["json", "native-tls-vendored"] }
sha2 = "0.10"
flate2 = "1"
